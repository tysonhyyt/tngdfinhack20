# =============================================================================
# GitHub Actions CI/CD Pipeline
# Build → Dockerize → Push to AWS ECR → Deploy to AWS ECS
# =============================================================================
#
# PREREQUISITES:
#   1. Create an ECR repository in your AWS account.
#   2. Create an ECS cluster, service, and task definition.
#   3. GitHub Actions → Settings → Secrets and variables → Actions
#      Add repository (or environment "production") secrets used at deploy time:
#
#      KAFKA_BOOTSTRAP_SERVERS
#      KAFKA_CLIENT_ID
#      KAFKA_SSL
#      KAFKA_SSL_REJECT_UNAUTHORIZED
#      KAFKA_SASL_MECHANISM
#      KAFKA_SASL_USERNAME
#      KAFKA_SASL_PASSWORD
#      KAFKA_TOPIC
#      KAFKA_CONSUMER_GROUP
#      KAFKAJS_NO_PARTITIONER_WARNING
#
#      DB_HOST
#      DB_PORT
#      DB_NAME
#      DB_USER
#      DB_PASS
#      DB_SSL
#
#      These are injected into the ECS task definition by the render step below.
#      (Optional) Use GitHub Environment secrets for the "production" environment.
#
# =============================================================================

name: Build, Push to ECR & Deploy to ECS

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

env:
  AWS_REGION: 'ap-southeast-5'
  ECR_REPOSITORY: 'tng/tngdfinhack20'
  ECS_CLUSTER: 'tngdfinhack20'
  ECS_SERVICE: 'tngdfinhack20-backend-service'
  ECS_TASK_DEFINITION: '.aws/task-definition.json'
  ECS_CONTAINER_NAME: 'tngdfinhack20-backend'
  AWS_OIDC_ROLE_ARN: 'arn:aws:iam::372206266092:role/github-deploy'

permissions:
  id-token: write
  contents: read

# =============================================================================
# JOBS
# =============================================================================
jobs:
  # ---------------------------------------------------------------------------
  # Job 1: Compile / Build the application
  # ---------------------------------------------------------------------------
  build:
    name: 🔨 Compile & Test
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      # ----- Choose ONE of the build tool sections below -----

      # ── Option A: Node.js / TypeScript ──
      - name: 🟢 Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: npm ci

      - name: 🧪 Run tests
        run: npm test --if-present

      - name: 🏗️ Build application
        run: npm run build

      # ── Option B: Java / Spring Boot (uncomment if needed) ──
      # - name: ☕ Set up JDK
      #   uses: actions/setup-java@v4
      #   with:
      #     java-version: '17'
      #     distribution: 'temurin'
      #     cache: 'gradle'            # or 'maven'
      #
      # - name: 🧪 Run tests
      #   run: ./gradlew test          # or: mvn test
      #
      # - name: 🏗️ Build application
      #   run: ./gradlew build -x test # or: mvn package -DskipTests

      # ── Option C: Python (uncomment if needed) ──
      # - name: 🐍 Set up Python
      #   uses: actions/setup-python@v5
      #   with:
      #     python-version: '3.12'
      #
      # - name: 📦 Install dependencies
      #   run: |
      #     python -m pip install --upgrade pip
      #     pip install -r requirements.txt
      #
      # - name: 🧪 Run tests
      #   run: pytest

      # ── Option D: Go (uncomment if needed) ──
      # - name: 🐹 Set up Go
      #   uses: actions/setup-go@v5
      #   with:
      #     go-version: '1.22'
      #
      # - name: 🧪 Run tests
      #   run: go test ./...
      #
      # - name: 🏗️ Build application
      #   run: go build -o app .

      # Upload build artifacts so the next job can use them
      - name: 📤 Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            dist/
            build/
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Job 2: Build Docker image & push to AWS ECR
  # ---------------------------------------------------------------------------
  dockerize-and-push:
    name: 🐳 Dockerize & Push to ECR
    runs-on: ubuntu-latest
    needs: build                     # Only runs after build succeeds
    if: github.event_name == 'push'
    outputs:
      image: ${{ steps.build-image.outputs.image }}

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 📥 Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: .

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 🔐 Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: 🐳 Build, tag & push Docker image to ECR
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          echo "🔨 Building Docker image..."
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
                     $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "📤 Pushing image to ECR..."
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT
          echo "✅ Image pushed: $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"

  # ---------------------------------------------------------------------------
  # Job 3: Deploy the image to AWS ECS
  # ---------------------------------------------------------------------------
  deploy-to-ecs:
    name: 🚀 Deploy to ECS
    runs-on: ubuntu-latest
    needs: dockerize-and-push        # Only runs after image is pushed
    environment: production          # Optional: use GitHub Environments for approvals

    steps:
      - name: 📥 Checkout source code
        uses: actions/checkout@v4

      - name: 🔑 Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_OIDC_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: 📝 Render new ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          container-name: ${{ env.ECS_CONTAINER_NAME }}
          image: ${{ needs.dockerize-and-push.outputs.image }}
          environment-variables: |
            PORT=3000
            KAFKA_BOOTSTRAP_SERVERS=${{ secrets.KAFKA_BOOTSTRAP_SERVERS }}
            KAFKA_CLIENT_ID=${{ secrets.KAFKA_CLIENT_ID }}
            KAFKA_SSL=${{ secrets.KAFKA_SSL }}
            KAFKA_SSL_REJECT_UNAUTHORIZED=${{ secrets.KAFKA_SSL_REJECT_UNAUTHORIZED }}
            KAFKA_SASL_MECHANISM=${{ secrets.KAFKA_SASL_MECHANISM }}
            KAFKA_SASL_USERNAME=${{ secrets.KAFKA_SASL_USERNAME }}
            KAFKA_SASL_PASSWORD=${{ secrets.KAFKA_SASL_PASSWORD }}
            KAFKA_TOPIC=${{ secrets.KAFKA_TOPIC }}
            KAFKA_CONSUMER_GROUP=${{ secrets.KAFKA_CONSUMER_GROUP }}
            KAFKAJS_NO_PARTITIONER_WARNING=${{ secrets.KAFKAJS_NO_PARTITIONER_WARNING }}
            DB_HOST=${{ secrets.DB_HOST }}
            DB_PORT=${{ secrets.DB_PORT }}
            DB_NAME=${{ secrets.DB_NAME }}
            DB_USER=${{ secrets.DB_USER }}
            DB_PASS=${{ secrets.DB_PASS }}
            DB_SSL=${{ secrets.DB_SSL }}

      - name: 🚀 Deploy to Amazon ECS
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

      - name: ✅ Deployment summary
        run: |
          echo "========================================="
          echo "🎉 Deployment Complete!"
          echo "========================================="
          echo "Cluster : ${{ env.ECS_CLUSTER }}"
          echo "Service : ${{ env.ECS_SERVICE }}"
          echo "Image   : ${{ needs.dockerize-and-push.outputs.image }}"
          echo "========================================="
